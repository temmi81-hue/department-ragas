# 60초 이내 본편 데모 — AI Match(구 Regulatory Search) 흐름 재녹화
# 2026-09-13 업데이트:
#  - "Regulatory Search" 탭이 "AI Match"로 이름이 바뀌어 캡션/흐름을 그에 맞게 갱신
#  - RAG 패널의 "이 추천으로 협업 요청 준비" 버튼(rag-draft-button)을 바로 사용해,
#    구버전 "규칙 기반 후보" 카드 선택 단계를 건너뛰고 AI 추천 → 메일 작성으로 바로 연결
#  - 자막 위치/가독성은 scripts/demo-video.mjs의 #demo-caption 스타일을 화면 하단
#    가장자리(하단 36px, 불투명 배경)로 옮겨 콘텐츠와 겹치지 않게 수정함(공용 스크립트 변경)
url: http://localhost:53307
output: out/department-workflow-demo-ai-match.mp4

speedSegments:
  - from: ragWaitStart
    to: ragWaitEnd
    target: 1.0

chapters:
  # 오프닝 카드
  - title: 업무 지침 네비게이터
    subtitle: 업무 상황을 입력하면 AI가 절차와 협업부서를 찾아 이메일 요청까지 이어줍니다
    steps:
      - wait: 600
        caption: 업무 지침 네비게이터에 접속합니다
      - move:
          selector: '#question'
      - wait: 200

  - title: 1. 업무 상황 검색
    subtitle: 질문을 입력하면 관련 절차와 담당부서를 찾아드립니다
    steps:
      - highlight:
          selector: '#question'
          duration: 600
          caption: 업무 상황을 입력합니다
      - type:
          selector: '#question'
          text: 5억 원 이상 설비 투자를 검토할 때 사전에 협의해야 할 부서와 절차를 알려주세요.
          delay: 30
      - click:
          selector: 'button:has-text("부서 찾기")'
          caption: 부서 찾기를 눌러 검색합니다
      - mark: ragWaitStart

  - title: 2. AI Match 결과 확인
    subtitle: RAG 근거로 주관부서와 협업부서를 한 번에 확인합니다
    steps:
      - move:
          selector: '.rag-panel'
      - mark: ragWaitEnd
      - scroll:
          selector: '.query-summary'
          duration: 400
      - highlight:
          selector: '.rag-panel'
          duration: 1500
          caption: AI가 근거 문서를 바탕으로 부서를 판정합니다
      - click:
          selector: '.rag-panel .result-title h2'
          caption: '주관부서: 투자관리그룹으로 확정됐습니다'
      - click:
          selector: '.rag-panel p:has-text("협업 부서")'
          caption: '협업 부서: 설비자재구매그룹도 함께 안내합니다'
      - highlight:
          selector: '.rag-panel .evidence'
          duration: 1300
          caption: 판정 근거가 된 지침 원문도 함께 제공합니다
      - wait: 200
      - click:
          selector: '[data-testid="rag-draft-button"]'
          caption: 이 추천으로 협업 요청 준비를 클릭합니다
      - wait: 400

  - title: 3. 협업 요청 메일 전송
    subtitle: 자동 정리된 요청 사항을 담당부서에 전송합니다
    steps:
      - scroll:
          selector: '.draft'
          duration: 500
          caption: 메일 초안 화면으로 이동합니다
      - expand:
          selector: '.draft textarea[aria-label="검토 요청 초안"]'
          duration: 300
      - highlight:
          selector: '.draft textarea[aria-label="검토 요청 초안"]'
          duration: 700
          caption: AI 추천 근거를 담은 요청 메일이 자동으로 작성됩니다
      - scroll:
          selector: '.send-button'
          duration: 300
      - click:
          selector: '.send-button'
          caption: 메일 보내기를 눌러 검토를 요청합니다
      - wait: 500

  - title: 4. 협업 진행 현황 관리
    subtitle: 메일 발송부터 회신 완료까지 진행 상태를 한 화면에서 확인합니다
    steps:
      - scroll:
          selector: '.request-tracker'
          duration: 700
          align: start
          caption: 업무 요청 진행 현황을 확인합니다
      - wait: 500
      - highlight:
          selector: '.request-tracker'
          duration: 1500
          caption: 질문 입력부터 회신 완료까지 4단계로 관리됩니다
      - click:
          selector: '.reply-tab'
          caption: 담당부서 접수 확인 · 검토중으로 변경합니다
      - wait: 700
      - highlight:
          selector: '.request-tracker'
          duration: 600
          caption: 상태가 검토중으로 바뀝니다
      - click:
          selector: '.reply-tab'
          caption: 현업 담당자 확인 후 회신 완료로 변경합니다
      - wait: 700
      - highlight:
          selector: '.request-tracker'
          duration: 700
          caption: 회신 완료로 최종 업데이트됩니다

  # 엔딩 카드
  - title: Compliance Hub
    subtitle: 참고 문서와 협업 요청 이력을 한 곳에서 관리합니다
    steps:
      - click:
          selector: 'nav.nav-links a:has-text("Compliance Hub")'
          caption: Compliance Hub로 이동합니다
      - wait: 300
      - scroll:
          selector: '.document-list'
          duration: 400
          caption: 참고 문서 목록을 확인합니다
      - highlight:
          selector: '.document-list'
          duration: 400
      - scroll:
          selector: '.request-log'
          duration: 400
          caption: 협업 요청 이력을 확인합니다
      - highlight:
          selector: '.request-log'
          duration: 700
      - wait: 300
